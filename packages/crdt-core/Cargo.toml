[package]
name = "meshboard-crdt-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
jvm = ["dep:jni"]
c-api = []

[dependencies]
yrs = "=0.27.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "=0.21.1", optional = true, default-features = false }
