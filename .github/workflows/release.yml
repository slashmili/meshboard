name: Release desktop apps

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.config.outputs.version }}
      app-origin: ${{ steps.config.outputs.app-origin }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - id: config
        name: Validate release tag and public deployment settings
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_APP_ORIGIN: ${{ vars.MESHBOARD_APP_ORIGIN }}
          RELEASE_TURN_DOMAIN: ${{ vars.MESHBOARD_TURN_DOMAIN }}
        run: node scripts/release-config.mjs

  tests:
    needs: configuration
    uses: ./.github/workflows/tests.yml

  linux:
    needs: [configuration, tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CI: 'true'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_APP_ORIGIN: ${{ needs.configuration.outputs.app-origin }}
      RELEASE_TURN_DOMAIN: ${{ vars.MESHBOARD_TURN_DOMAIN }}
      PACKAGE_VERSION: ${{ needs.configuration.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libasound2 libgl1 libegl1 libfontconfig1
      - name: Build bundled desktop distribution
        run: ./packages/native/gradlew -p packages/native "-Pmeshboard.appOrigin=$RELEASE_APP_ORIGIN" "-Pmeshboard.version=$PACKAGE_VERSION" createDistributable
      - name: Build and smoke-test AppImage
        run: bash scripts/package-appimage.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-linux-x86_64
          if-no-files-found: error
          path: build/release/*.AppImage

  macos:
    needs: [configuration, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CI: 'true'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_APP_ORIGIN: ${{ needs.configuration.outputs.app-origin }}
      PACKAGE_VERSION: ${{ needs.configuration.outputs.version }}
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build DMG with bundled JVM
        run: |
          test "$(uname -m)" = "$PACKAGE_ARCH"
          ./packages/native/gradlew -p packages/native "-Pmeshboard.appOrigin=$RELEASE_APP_ORIGIN" "-Pmeshboard.version=$PACKAGE_VERSION" packageDmg
      - name: Smoke-test the packaged launcher and name the release asset
        run: |
          packages/native/build/compose/binaries/main/app/Meshboard.app/Contents/MacOS/Meshboard --print-build-info | tee /tmp/meshboard-build-info.txt
          grep -Fx "App origin: $RELEASE_APP_ORIGIN" /tmp/meshboard-build-info.txt
          mkdir -p build/release
          packages=(packages/native/build/compose/binaries/main/dmg/*.dmg)
          test "${#packages[@]}" = 1
          cp "${packages[0]}" "build/release/Meshboard-${RELEASE_TAG}-macos-${PACKAGE_ARCH}.dmg"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: build/release/*.dmg

  publish:
    name: Attach verified packages to the GitHub Release
    needs: [configuration, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_APP_ORIGIN: ${{ needs.configuration.outputs.app-origin }}
      RELEASE_TURN_DOMAIN: ${{ vars.MESHBOARD_TURN_DOMAIN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release
      - name: Create checksums and attach assets
        run: |
          node scripts/release-config.mjs > build/release/release-info.json
          cd build/release
          test -f "Meshboard-${RELEASE_TAG}-linux-x86_64.AppImage"
          test -f "Meshboard-${RELEASE_TAG}-macos-arm64.dmg"
          test -f "Meshboard-${RELEASE_TAG}-macos-x86_64.dmg"
          sha256sum -- *.AppImage *.dmg release-info.json > SHA256SUMS
          gh release upload "$RELEASE_TAG" --clobber -- *.AppImage *.dmg release-info.json SHA256SUMS
