name: Meshboard toolchains
description: Install the lockfile's pnpm version, Node 22, and JDK 21
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: false
    - name: Install Rust for packaged CRDT bindings
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --no-self-update
        rustup default stable
    - name: Enable Gradle task-output caching
      shell: bash
      run: echo "GRADLE_OPTS=${GRADLE_OPTS:+$GRADLE_OPTS }-Dorg.gradle.caching=true" >> "$GITHUB_ENV"
    - run: pnpm install --frozen-lockfile
      shell: bash
