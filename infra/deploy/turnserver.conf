# Deployment addresses, credentials, limits and certificate paths are supplied
# by start.sh from environment variables, not committed into this file.
listening-port=3478
fingerprint
use-auth-secret
no-cli
no-tlsv1
no-tlsv1_1
no-dtls
no-tcp-relay
no-multicast-peers
no-rfc5780
no-software-attribute
stale-nonce=600
user-quota=16
relay-threads=2
pidfile=/tmp/turnserver.pid
# Do not collect peer addresses, credentials, or signaling payloads in logs.
log-file=/dev/null
no-stdout-log

# Block relay access to local/private/link-local/metadata and reserved networks.
# IPv6 peer relaying is disabled below; the first deployment is IPv4-only.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
# Do not start this range at "::": Coturn treats an unspecified lower bound as
# a wildcard across address families, which also denies every public IPv4 peer.
# The unspecified address itself is already rejected by Coturn.
denied-peer-ip=::1-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
