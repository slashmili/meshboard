# Local testing only. Do not deploy this configuration publicly.
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=3478
min-port=49160
max-port=49200
realm=meshboard.local
lt-cred-mech
user=meshboard-dev:local-testing-only
fingerprint
no-tls
no-dtls
no-cli
no-multicast-peers
# Required only for testing two browsers on the same computer.
allow-loopback-peers
no-rfc5780
no-software-attribute
no-stdout-log
simple-log
log-file=/dev/null
pidfile=/tmp/turnserver.pid
user-quota=16
total-quota=64
